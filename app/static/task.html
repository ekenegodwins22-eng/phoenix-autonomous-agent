<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phoenix Task Session</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#101014;color:#f5f5fb;margin:0;padding-bottom:112px}.wrap{max-width:900px;margin:auto;padding:20px 16px}.card{background:#19191f;border:1px solid #303039;border-radius:16px;padding:18px;margin:14px 0}.muted{color:#aaaab5}.status{font-size:1.2rem;font-weight:700}.error{color:#ffaaa8}button{padding:10px 14px;margin:4px;border:0;border-radius:9px;font-weight:700;cursor:pointer;background:#e9e9ef;color:#15151a}button:disabled{opacity:.45;cursor:not-allowed}.danger{background:#7e3036;color:#fff}pre{white-space:pre-wrap;background:#0b0b0e;padding:14px;border-radius:10px;max-height:420px;overflow:auto}.log{border-bottom:1px solid #303039;padding:8px 0;font-size:.9rem}.hidden{display:none}.chat{position:fixed;z-index:5;left:0;right:0;bottom:0;background:#17171c;border-top:1px solid #35353f;padding:10px max(14px,calc((100vw - 900px)/2 + 14px));box-shadow:0 -8px 24px #0008}.chat-row{display:flex;gap:8px;align-items:flex-end}.chat textarea{flex:1;resize:none;min-height:48px;max-height:130px;border:1px solid #454550;border-radius:14px;background:#29292f;color:#fff;padding:13px;font:inherit}.chat .send{border-radius:50%;width:48px;height:48px;padding:0;background:#fff;color:#111;font-size:1.3rem}.chat-actions{display:flex;justify-content:space-between;align-items:center}.chat-actions small{color:#92929e}.message{padding:10px 13px;border-radius:13px;margin:8px 0;max-width:88%;white-space:pre-wrap}.message.user{margin-left:auto;background:#2f4f82}.message.agent,.message.system{background:#292930}.message-meta{font-size:.72rem;color:#aaaab5;margin-bottom:3px}
</style></head><body><main class="wrap"><h1>Phoenix Task Session</h1><p id="auth" class="muted">Sign in through the main Phoenix page first, then return to this session URL.</p><section id="content" class="hidden"><div class="card"><div class="status" id="status"></div><p id="progress" class="muted"></p><p id="timing" class="muted"></p><button onclick="refresh()">Refresh</button><button id="cancel" class="danger" onclick="control('cancel')">Stop task</button><button id="retry" onclick="control('retry')">Retry safely</button><button id="resume" onclick="control('resume')">Resume verification</button></div><div class="card"><h2>Task</h2><p id="instruction"></p><h2>Result</h2><pre id="result">No result yet.</pre><p id="error" class="error"></p></div><div class="card"><h2>Task chat</h2><p class="muted">Send a correction or a new instruction while Phoenix is working. Type “stop” to stop the task.</p><div id="messages"></div></div><div class="card"><h2>Task log</h2><div id="logs"></div></div></section></main><section class="chat"><div class="chat-row"><textarea id="composer" rows="1" placeholder="Send a correction or instruction…"></textarea><button class="send" onclick="sendMessage()" aria-label="Send message">↑</button></div><div class="chat-actions"><small id="chatStatus">Task chat is connected when signed in.</small><button class="danger" onclick="sendStop()">Stop</button></div></section><script>
const token=localStorage.getItem('phoenix_token');const ref=decodeURIComponent(location.pathname.split('/').filter(Boolean)[1]||'');const $=id=>document.getElementById(id);let timer;let lastMessageSignature='';
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(options.headers||{})}});let d;try{d=await r.json()}catch{d={detail:'HTTP '+r.status}}if(!r.ok)throw Error(d.detail||'Request failed');return d}
function render(d){$('content').classList.remove('hidden');$('auth').classList.add('hidden');$('status').textContent=d.status;$('progress').textContent=d.progress||'';$('instruction').textContent=d.instruction||'';$('result').textContent=d.result||'No result yet.';$('error').textContent=d.error||'';$('timing').textContent='Created: '+d.created_at+' | Updated: '+d.updated_at;$('cancel').disabled=['completed','failed','cancelled'].includes(d.status);$('retry').disabled=d.status!=='failed';$('resume').disabled=d.status!=='waiting_human';$('logs').innerHTML=(d.logs||[]).map(x=>`<div class="log"><b>${x.level}</b> ${x.created_at}<br>${x.message}</div>`).join('')||'<p class="muted">No log entries.</p>'}
function renderMessages(rows){const sig=rows.map(x=>x.id+':'+x.content).join('|');if(sig===lastMessageSignature)return;lastMessageSignature=sig;$('messages').innerHTML=rows.map(x=>`<div class="message ${x.role}"><div class="message-meta">${x.role} · ${x.created_at}</div>${escapeHtml(x.content)}</div>`).join('')||'<p class="muted">No messages yet.</p>';window.scrollTo(0,document.body.scrollHeight)}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function refresh(){if(!token){$('auth').textContent='Sign in through the main Phoenix page first.';return}try{render(await api('/tasks/'+ref));renderMessages(await api('/tasks/'+ref+'/messages'));$('chatStatus').textContent='Connected';}catch(e){$('auth').textContent=e.message;$('chatStatus').textContent='Disconnected; task continues on the server.';$('content').classList.add('hidden')}}
async function control(kind){try{await api('/tasks/'+ref+'/'+kind,{method:'POST'});await refresh()}catch(e){$('error').textContent=e.message}}
async function sendMessage(){const box=$('composer');const content=box.value.trim();if(!content)return;box.disabled=true;try{await api('/tasks/'+ref+'/messages',{method:'POST',body:JSON.stringify({content})});box.value='';$('chatStatus').textContent='Message sent';await refresh()}catch(e){$('chatStatus').textContent=e.message}finally{box.disabled=false;box.focus()}}
function sendStop(){$('composer').value='stop';sendMessage()}
$('composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});refresh();timer=setInterval(refresh,2000);
</script></body></html>
