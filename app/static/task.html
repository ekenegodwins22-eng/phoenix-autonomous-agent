<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phoenix Task Session</title><style>body{font-family:system-ui;background:#101018;color:#f5f5fb;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#191923;border:1px solid #30303d;border-radius:16px;padding:20px;margin:16px 0}.muted{color:#aaaabd}button{padding:10px 14px;margin:4px;border:0;border-radius:8px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#0b0b11;padding:14px;border-radius:10px;max-height:420px;overflow:auto}.status{font-size:1.2rem;font-weight:700}.error{color:#ffaaa8}.log{border-bottom:1px solid #30303d;padding:8px 0}.hidden{display:none}</style></head><body><main class="wrap"><h1>Phoenix Task Session</h1><p id="auth" class="muted">Sign in through the main Phoenix page first, then return to this session URL.</p><section id="content" class="hidden"><div class="card"><div class="status" id="status"></div><p id="progress" class="muted"></p><p id="timing" class="muted"></p><button onclick="refresh()">Refresh</button><button id="cancel" onclick="control('cancel')">Cancel task</button><button id="retry" onclick="control('retry')">Retry safely</button><button id="resume" onclick="control('resume')">Resume verification</button></div><div class="card"><h2>Task</h2><p id="instruction"></p><h2>Result</h2><pre id="result">No result yet.</pre><p id="error" class="error"></p></div><div class="card"><h2>Task log</h2><div id="logs"></div></div></section><script>
const token=localStorage.getItem('phoenix_token');const ref=decodeURIComponent(location.pathname.split('/').filter(Boolean)[1]||'');const $=id=>document.getElementById(id);let timer;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(options.headers||{})}});let d;try{d=await r.json()}catch{d={detail:'HTTP '+r.status}}if(!r.ok)throw Error(d.detail||'Request failed');return d}
function render(d){$('content').classList.remove('hidden');$('auth').classList.add('hidden');$('status').textContent=d.status;$('progress').textContent=d.progress||'';$('instruction').textContent=d.instruction||'';$('result').textContent=d.result||'No result yet.';$('error').textContent=d.error||'';$('timing').textContent='Created: '+d.created_at+' | Updated: '+d.updated_at;$('cancel').disabled=['completed','failed','cancelled'].includes(d.status);$('retry').disabled=d.status!=='failed';$('resume').disabled=d.status!=='waiting_human';$('logs').innerHTML=(d.logs||[]).map(x=>`<div class="log"><b>${x.level}</b> ${x.created_at}<br>${x.message}</div>`).join('')||'<p class="muted">No log entries.</p>'}
async function refresh(){if(!token){$('auth').textContent='Sign in through the main Phoenix page first.';return}try{render(await api('/tasks/'+ref))}catch(e){$('auth').textContent=e.message;$('content').classList.add('hidden');clearInterval(timer)}}
async function control(kind){try{await api('/tasks/'+ref+'/'+kind,{method:'POST'});await refresh()}catch(e){$('error').textContent=e.message}}
refresh();timer=setInterval(refresh,2000);
</script></main></body></html>
