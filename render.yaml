services:
  - type: web
    name: phoenix-autonomous-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PRIMARY_BASE_URL
        value: https://concerned-swordfish-suhailtechlnfo-01fd2de0.koyeb.app
      - key: PRIMARY_API_KEY
        sync: false
      - key: PRIMARY_CHAT_RETRY_ATTEMPTS
        value: "3"
      - key: PRIMARY_CHAT_RETRY_BASE_SECONDS
        value: "0.5"
      - key: PRIMARY_CHAT_RETRY_MAX_SECONDS
        value: "8"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-2.5-flash,gemini-2.5-pro
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phoenix-db
          property: connectionString
      - key: MAILBOX_API_BASE_URL
        value: https://gmail-alias-api.senseiphoenix.name.ng
      - key: MAILBOX_API_TOKEN
        sync: false
      - key: MAILBOX_API_COOKIE
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright
      - key: RUNTIME_TEMP_DIR
        value: /tmp/phoenix
      - key: RUNTIME_TEMP_RETENTION_SECONDS
        value: "3600"
      - key: RUNTIME_CLEANUP_MAX_ENTRIES
        value: "100"
      - key: RESOURCE_DISK_PATH
        value: /
      - key: MINIMUM_FREE_DISK_BYTES
        value: "268435456"
      - key: MAXIMUM_MEMORY_USED_PERCENT
        value: "92"
      - key: MAX_TASK_RECOVERY_ATTEMPTS
        value: "2"
      - key: TASK_TIMEOUT_SECONDS
        value: "900"
      - key: MAX_AGENT_STEPS
        value: "60"
      - key: MODEL_ACTION_RETRIES
        value: "2"
      - key: BROWSER_RETRY_ATTEMPTS
        value: "3"

databases:
  - name: phoenix-db
    plan: free
    region: oregon
    databaseName: phoenix
    user: phoenix
